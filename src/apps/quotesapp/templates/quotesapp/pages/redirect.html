{% comment %}
  A page that has moved: an old ?tag= URL, now /tags/<tag>/ (views.tags_all,
  tools/tag-redirects). The canonical tells search engines where the page
  lives now; the refresh takes people there.
{% endcomment %}<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Moved | Quotes | Michele Pasin</title>
    <link rel="canonical" href="{{ SITE_URL }}{{ target }}">
    <meta name="robots" content="noindex,follow">
    <meta http-equiv="refresh" content="0; url={{ target }}">
  </head>
  <body>
    <p>This page has moved to <a href="{{ target }}">{{ SITE_URL }}{{ target }}</a>.</p>
  </body>
</html>
