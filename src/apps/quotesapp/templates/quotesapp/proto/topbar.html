{% comment %}
  The michelepasin.org "A · Top bar", with this site's sections. `section`
  is the resolved URL name, set in proto/base.html; qa_quotes is /quotes/,
  which the prototypes use as the index of sources.
{% endcomment %}

<header class="topbar">
  <a class="topbar-name" href="{% url 'quotesapp:home' %}">Michele Pasin <span class="topbar-site">/ Quotes</span></a>
  <nav class="topbar-nav" aria-label="Site navigation">
    <a href="{% url 'quotesapp:tags' %}" {% if section == "tags" %}class="is-current"{% endif %}>Tags</a>
    <a href="{% url 'quotesapp:qa_quotes' %}" {% if section == "qa_quotes" or section == "source" %}class="is-current"{% endif %}>Sources</a>
    <a href="{% url 'quotesapp:about' %}" {% if section == "about" %}class="is-current"{% endif %}>About</a>
    <a class="topbar-out" href="https://www.michelepasin.org">michelepasin.org &#8599;</a>
  </nav>
</header>
